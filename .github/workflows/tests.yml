name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The same script cloud sessions use: SQL Server in Docker, generated secrets, then dotnet test.
      - name: Run integration tests
        run: scripts/test-linux.sh
